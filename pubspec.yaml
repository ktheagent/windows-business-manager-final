name: airmonlink_business_manager
description: Offline-first Windows POS, inventory, customer, supplier, expense and reporting software.
publish_to: none
version: 1.3.0+9

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  crypto: 3.0.7
  cryptography: 2.9.0
  device_info_plus: ^12.4.0
  excel: ^4.0.6
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  http: 1.6.0
  intl: 0.20.3
  mailer: 7.2.0
  package_info_plus: ^9.0.1
  path: 1.9.1
  path_provider: 2.1.6
  pdf: ^3.12.0
  printing: 5.14.3
  sqflite_common: 2.5.11
  sqflite_common_ffi: 2.4.2
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
