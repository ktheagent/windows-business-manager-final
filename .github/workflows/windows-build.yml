name: Validate and Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PRODUCT_PREFIX: Airmonlink-Business-Manager-1.3.0-Build8
      FLUTTER_VERSION: '3.44.5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify identity
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*1\.3\.0\+8\s*$') {
            throw 'pubspec.yaml must contain version: 1.3.0+8'
          }

      - name: Clean
        run: flutter clean

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        shell: pwsh
        run: |
          flutter analyze --no-fatal-infos 2>&1 | Tee-Object analyzer-report.txt
          if ($LASTEXITCODE -ne 0) { throw "Analysis failed: $LASTEXITCODE" }

      - name: Run tests
        shell: pwsh
        run: |
          flutter test --reporter expanded 2>&1 | Tee-Object flutter-test-report.txt
          if ($LASTEXITCODE -ne 0) { throw "Tests failed: $LASTEXITCODE" }

      - name: Validate source and migrations
        shell: pwsh
        run: |
          python tool/validate_source_checkpoint.py . 2>&1 | Tee-Object source-checkpoint-report.txt
          if ($LASTEXITCODE -ne 0) { throw "Source validation failed: $LASTEXITCODE" }
          python tool/local_release_validation.py . 2>&1 | Tee-Object migration-validation-report.txt
          if ($LASTEXITCODE -ne 0) { throw "Migration validation failed: $LASTEXITCODE" }

      - name: Reject legacy release identities
        shell: pwsh
        run: |
          $legacyIdentity = 'Legacy Build 4, Build 5, Build 6'
          Write-Host "Rejecting legacy release identities: $legacyIdentity"
          if (Test-Path dist) {
            $legacyFiles = Get-ChildItem dist -Recurse -File | Where-Object {
              $_.Name -match 'Build(?:4|5|6)'
            }
            if ($legacyFiles) {
              $names = ($legacyFiles | ForEach-Object { $_.FullName }) -join '; '
              throw "Legacy release artifacts detected: $names"
            }
          }

      - name: Verify Windows platform source
        shell: pwsh
        run: ./tool/bootstrap_windows.ps1

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object windows-build-report.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed: $LASTEXITCODE" }

      - name: Verify Windows payload
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          foreach ($path in @(
            'airmonlink_business_manager.exe',
            'flutter_windows.dll',
            'data\flutter_assets\AssetManifest.bin'
          )) {
            if (-not (Test-Path (Join-Path $release $path))) {
              throw "Missing runtime file: $path"
            }
          }

      - name: Create portable package
        shell: pwsh
        run: ./tool/package_windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Missing Inno Setup compiler: ISCC.exe" }
          ./tool/build_installer.ps1

      - name: Smoke-test portable application
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'airmonlink-portable-smoke'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Expand-Archive "dist/$env:PRODUCT_PREFIX-Portable.zip" -DestinationPath $root
          $exe = Join-Path $root 'airmonlink_business_manager.exe'
          if (-not (Test-Path $exe)) { throw 'Portable executable missing.' }
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Portable app exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'airmonlink-installed-smoke'
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          $installer = Resolve-Path "dist/$env:PRODUCT_PREFIX-Setup.exe"
          $result = Start-Process $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installRoot"
          ) -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited: $($result.ExitCode)" }
          $exe = Join-Path $installRoot 'airmonlink_business_manager.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing.' }
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Installed app exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Create full-source package
        shell: pwsh
        run: ./tool/package_source.ps1

      - name: Verify artifacts and create checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/$env:PRODUCT_PREFIX-Setup.exe",
            "dist/$env:PRODUCT_PREFIX-Portable.zip",
            "dist/$env:PRODUCT_PREFIX-Full-Source.zip"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Empty release file: $file" }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content "dist/$env:PRODUCT_PREFIX-SHA256SUMS.txt" -Encoding ascii

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Airmonlink-Build8-Diagnostics
          path: |
            analyzer-report.txt
            flutter-test-report.txt
            source-checkpoint-report.txt
            migration-validation-report.txt
            windows-build-report.txt
            installer-build-report.txt
            BUILD8-LOCAL-VALIDATION.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build 8 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Airmonlink-Business-Manager-1.3.0-Build8-Release
          path: |
            dist/Airmonlink-Business-Manager-1.3.0-Build8-Setup.exe
            dist/Airmonlink-Business-Manager-1.3.0-Build8-Portable.zip
            dist/Airmonlink-Business-Manager-1.3.0-Build8-Full-Source.zip
            dist/Airmonlink-Business-Manager-1.3.0-Build8-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
