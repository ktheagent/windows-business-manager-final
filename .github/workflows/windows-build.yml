name: Validate and Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main, feature/build8-commercial-suite-complete]
  pull_request:
    branches: [main, feature/build8-commercial-suite-complete]

permissions:
  contents: read

concurrency:
  group: build8-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PRODUCT_PREFIX: Airmonlink-Business-Manager-1.3.0-Build8
      FLUTTER_VERSION: 3.44.5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Verify Build 8 identity
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*1\.3\.0\+8\s*$') {
            throw 'pubspec.yaml must contain version: 1.3.0+8'
          }

          # Reject only old packaged release files. Required audit documents such
          # as BUILD6-BASELINE-AUDIT.md are intentionally allowed.
          $legacy = Get-ChildItem -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '[\\/](\.git|build|\.dart_tool)[\\/]' -and
              $_.Name -match '(?i)^Airmonlink-Business-Manager-.*(?:Build[456]|1\.1\.1).*(?:\.exe|\.msi|\.vip)$'
            }
          if ($legacy) {
            $legacy | ForEach-Object { Write-Error "Legacy release package: $($_.FullName)" }
            throw 'Legacy release package filename detected.'
          }

      - name: Clean
        run: flutter clean

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency graph
        shell: pwsh
        run: |
          if (-not (Test-Path pubspec.lock)) { throw 'pubspec.lock was not generated.' }
          if (Select-String -Path pubspec.yaml -Pattern '(?m)^\s*dependency_overrides\s*:') { throw 'dependency_overrides are forbidden.' }
          flutter pub deps --style=compact | Tee-Object dependency-tree.txt
          $deps = flutter pub deps --json | ConvertFrom-Json
          $resolved = @{}
          foreach ($package in $deps.packages) { $resolved[$package.name] = $package.version }
          foreach ($name in @('file_picker','device_info_plus','package_info_plus','win32','win32_registry','pdf','excel','xml')) {
            if (-not $resolved.ContainsKey($name)) { throw "Missing resolved dependency: $name" }
            Write-Host "$name=$($resolved[$name])"
          }
          $win32 = @($deps.packages | Where-Object { $_.name -eq 'win32' })
          if ($win32.Count -ne 1) { throw "Expected one win32 version, found $($win32.Count)." }

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: pwsh
        run: |
          flutter test --reporter expanded 2>&1 | Tee-Object flutter-test-report.txt
          if ($LASTEXITCODE -ne 0) { throw "flutter test failed with exit code $LASTEXITCODE" }

      - name: Validate source and migration simulation
        run: |
          python tool/validate_source_checkpoint.py .
          python tool/local_release_validation.py .

      - name: Prepare Windows platform
        shell: pwsh
        run: ./tool/bootstrap_windows.ps1

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify Windows payload
        shell: pwsh
        run: |
          $release = Get-ChildItem build/windows -Directory -Recurse |
            Where-Object { $_.Name -eq 'Release' -and (Test-Path (Join-Path $_.FullName 'airmonlink_business_manager.exe')) } |
            Select-Object -First 1
          if (-not $release) { throw 'Windows Release directory was not found.' }
          foreach ($path in @(
            'airmonlink_business_manager.exe',
            'flutter_windows.dll',
            'data/flutter_assets/AssetManifest.bin',
            'data/flutter_assets/FontManifest.json',
            'data/flutter_assets/NOTICES.Z'
          )) {
            if (-not (Test-Path (Join-Path $release.FullName $path))) { throw "Missing runtime file: $path" }
          }

      - name: Create portable package
        shell: pwsh
        run: ./tool/package_windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\airmonlink_business_manager.iss'

      - name: Create full source package
        shell: pwsh
        run: ./tool/package_source.ps1

      - name: Verify artifacts and create SHA-256
        shell: pwsh
        run: |
          $expected = @(
            "dist/$env:PRODUCT_PREFIX-Setup.exe",
            "dist/$env:PRODUCT_PREFIX-Portable.zip",
            "dist/$env:PRODUCT_PREFIX-Full-Source.zip"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Empty release file: $file" }
          }
          $legacy = Get-ChildItem dist -File |
            Where-Object { $_.Name -match '(?i)(Build[456]|1\.1\.1)' }
          if ($legacy) { throw 'Legacy artifact filename detected in dist.' }
          $lines = foreach ($file in $expected) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $sum = "dist/$env:PRODUCT_PREFIX-SHA256SUMS.txt"
          $lines | Set-Content $sum -Encoding ascii
          foreach ($line in Get-Content $sum) {
            $parts = $line -split '\s+', 2
            $actual = (Get-FileHash (Join-Path dist $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum verification failed: $($parts[1])" }
          }

      - name: Upload Build 8 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Airmonlink-Business-Manager-1.3.0-Build8-Release
          path: |
            dist/Airmonlink-Business-Manager-1.3.0-Build8-Setup.exe
            dist/Airmonlink-Business-Manager-1.3.0-Build8-Portable.zip
            dist/Airmonlink-Business-Manager-1.3.0-Build8-Full-Source.zip
            dist/Airmonlink-Business-Manager-1.3.0-Build8-SHA256SUMS.txt
            dependency-tree.txt
            flutter-test-report.txt
            BUILD8-LOCAL-VALIDATION.json
          if-no-files-found: error
          retention-days: 30
