name: Apply verified Build 8 fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-build8-fixes.yml'

permissions:
  contents: write

concurrency:
  group: verified-build8-fixes
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply the two evidence-based corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if new in text:
                  print(f"already applied: {path}")
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one verified pattern in {path}; found {count}"
                  )
              file_path.write_text(
                  text.replace(old, new, 1),
                  encoding="utf-8",
                  newline="\n",
              )
              print(f"updated: {path}")

          replace_once(
              "test/build5_features_test.dart",
              """      await state.refreshAll();
              });

              test('reprinting does not alter stock or transaction data', () async {""",
              """      await state.refreshAll();
              });

              tearDown(() => database.close());

              test('reprinting does not alter stock or transaction data', () async {""",
          )

          replace_once(
              "lib/commercial/services/commercial_service.dart",
              """  static Future<void> _writeAudit(
              """,
              """  static Object? _jsonSafe(Object? value) {
                if (value is Map) {
                  return <String, Object?>{
                    for (final entry in value.entries)
                      entry.key.toString(): _jsonSafe(entry.value),
                  };
                }
                if (value is Iterable) {
                  return value.map(_jsonSafe).toList(growable: false);
                }
                if (value is DateTime) return value.toIso8601String();
                return value;
              }

              static String _encodeAuditValues(Map<String, Object?> values) =>
                  jsonEncode(_jsonSafe(values));

              static Future<void> _writeAudit(
              """,
          )

          replace_once(
              "lib/commercial/services/commercial_service.dart",
              """    'old_values': oldValues == null ? null : jsonEncode(oldValues),
              """,
              """    'old_values': oldValues == null ? null : _encodeAuditValues(oldValues),
              """,
          )

          replace_once(
              "lib/commercial/services/commercial_service.dart",
              """    'new_values': newValues == null ? null : jsonEncode(newValues),
              """,
              """    'new_values': newValues == null ? null : _encodeAuditValues(newValues),
              """,
          )
          PY

      - name: Format corrected files
        run: |
          dart format \
            lib/commercial/services/commercial_service.dart \
            test/build5_features_test.dart

      - name: Run affected tests
        run: |
          flutter test test/build5_features_test.dart --reporter expanded
          flutter test test/build8_regression_test.dart --reporter expanded
          flutter test test/commercial_service_test.dart --reporter expanded

      - name: Run complete test suite
        run: fluter test --reporter expanded

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/commercial/services/commercial_service.dart \
            test/build5_features_test.dart
          if git diff --cached --quiet; then
            echo "The verified corrections were already present."
          else
            git commit -m "Fix Build 8 test isolation and transfer audit encoding"
            git push origin HEAD:main
          fi
