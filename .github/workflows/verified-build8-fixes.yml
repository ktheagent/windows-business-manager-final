name: Apply final verified Build 8 test fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool/apply_final_build8_test_fixes.py'

permissions:
  contents: write

concurrency:
  group: final-build8-test-fixes
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply verified corrections
        run: python3 tool/apply_final_build8_test_fixes.py

      - name: Format corrected files
        run: |
          dart format \
            lib/commercial/services/commercial_service.dart \
            test/build5_features_test.dart

      - name: Run affected tests
        run: |
          flutter test test/build5_features_test.dart --reporter expanded
          flutter test test/build8_regression_test.dart --reporter expanded
          flutter test test/commercial_service_test.dart --reporter expanded

      - name: Run complete test suite
        shell: pwsh
        run: |
          flutter test --reporter expanded 2>&1 | Tee-Object final-build8-test-report.txt
          if ($LASTEXITCODE -ne 0) { throw "Full test suite failed: $LASTEXITCODE" }

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/commercial/services/commercial_service.dart \
            test/build5_features_test.dart
          if git diff --cached --quiet; then
            echo "Verified corrections were already present."
          else
            git commit -m "Fix Build 8 test isolation and audit encoding"
            git push origin HEAD:main
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Airmonlink-Build8-Final-Test-Fix-Diagnostics
          path: final-build8-test-report.txt
          if-no-files-found: warn
          retention-days: 30
