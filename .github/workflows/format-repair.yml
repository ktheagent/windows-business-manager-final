name: Apply Build 8 analyzer repairs

on:
  workflow_dispatch:
  push:
    paths:
      - tool/apply_build8_syntax_repair.py
      - .github/workflows/format-repair.yml
      - pubspec.yaml

permissions:
  contents: write

concurrency:
  group: build8-analyzer-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply deterministic compatibility repairs
        run: python3 tool/apply_build8_syntax_repair.py

      - name: Apply supported Dart analyzer fixes
        run: dart fix --apply

      - name: Format all Dart sources
        run: dart format .

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Commit repaired source and lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.yaml pubspec.lock
          if git diff --cached --quiet; then
            echo "No analyzer repair changes were required."
          else
            git commit -m "Apply Build 8 analyzer fixes"
            git push origin HEAD:main
          fi
