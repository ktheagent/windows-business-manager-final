name: Apply final Build 9 workflow fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool/apply_build9_final_workflow_fixes.py'
      - 'tool/apply_build9_validation_hardening.py'
      - 'tool/prepare_build9_pipeline.py'
      - '.github/workflows/apply-build9-final-workflow-fixes.yml'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Normalize and syntax-check Build 9 generators
        run: |
          python3 tool/prepare_build9_pipeline.py normalize
          python3 -m py_compile tool/prepare_build9_pipeline.py
          python3 -m py_compile tool/apply_build9_final_workflow_fixes.py
          python3 -m py_compile tool/apply_build9_validation_hardening.py

      - name: Apply final Build 9 corrections
        run: python3 tool/apply_build9_final_workflow_fixes.py

      - name: Apply validation hardening
        run: python3 tool/apply_build9_validation_hardening.py

      - name: Remove verified unused Build 9 theme alias
        run: python3 tool/prepare_build9_pipeline.py cleanup-theme

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart
        run: dart format lib/commercial/screens/document_editor_dialog.dart lib/screens/pos_screen.dart lib/commercial/screens/commercial_suite_screen.dart lib/commercial/services/commercial_service.dart lib/core/app_theme.dart test/build9_workflow_regression_test.dart

      - name: Check generated diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test Build 9 workflow regression
        run: flutter test test/build9_workflow_regression_test.dart --reporter expanded

      - name: Test full suite
        run: flutter test --reporter expanded

      - name: Commit validated Build 9 source only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          git restore -- .github/workflows
          git restore -- tool/apply_build9_final_workflow_fixes.py
          git restore -- tool/apply_build9_validation_hardening.py

          git add -A
          git diff --cached --name-status

          # Workflow files and temporary Build 9 generator files must never be committed by the bot.
          if git diff --cached --name-only | grep -Eq '^\.github/workflows/|^tool/apply_build9_'; then
            echo "Forbidden workflow/helper path found in staged Build 9 source." >&2
            exit 1
          fi

          # Bytecode is allowed only as a deletion, to clean historical tracked pollution.
          while IFS=$'\t' read -r status path rest; do
            [ -z "${path:-}" ] && continue
            if [[ "$path" == *"/__pycache__/"* || "$path" == __pycache__/* || "$path" == *.pyc ]]; then
              if [[ "$status" != D* ]]; then
                echo "Added or modified Python bytecode is forbidden: $status $path" >&2
                exit 1
              fi
            fi
          done < <(git diff --cached --name-status)

          if git diff --cached --quiet; then
            echo "No validated Build 9 source changes to commit." >&2
            exit 1
          fi

          git commit -m "Fix commercial workflows and release Build 9"
          git push origin HEAD:main
