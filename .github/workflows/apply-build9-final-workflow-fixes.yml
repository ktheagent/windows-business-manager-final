name: Apply final Build 9 workflow fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool/apply_build9_final_workflow_fixes.py'
      - 'tool/apply_build9_validation_hardening.py'
      - '.github/workflows/apply-build9-final-workflow-fixes.yml'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Normalize and syntax-check Build 9 patch scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              return text.replace(old, new, 1)

          final_path = Path('tool/apply_build9_final_workflow_fixes.py')
          final_text = final_path.read_text(encoding='utf-8')

          final_text = final_text.replace(
              '    final draft = SaleDraft(\n"",\n',
              '    final draft = SaleDraft(\n""",\n',
          )
          final_text = final_text.replace("    r 'bool(re.search", "    r'bool(re.search")
          final_text = final_text.replace(
              r'(?m)^version:\*\1\.3\.0\\+8\s*$',
              r'(?m)^version:\s*1\.3\.0\+8\s*$',
          )
          final_text = final_text.replace(
              r'(?m)^version:\*\1\.3\.0\\+9\s*$',
              r'(?m)^version:\s*1\.3\.0\+9\s*$',
          )

          final_text = replace_exact(
              final_text,
              "        cashSessionId: refundMethod == 'Cash'\n"
              "            ? widget.state.currentCashSession?['id'] as int?\n"
              "            : null,\n",
              "        cashSessionId: refundMethod == 'Cash'\n"
              "            ? (widget.state.currentCashSession?['id'] as int?)\n"
              "            : null,\n",
              'cashSessionId ternary normalization',
          )
          final_path.write_text(final_text, encoding='utf-8')
          compile(final_text, str(final_path), 'exec')

          hardening_path = Path('tool/apply_build9_validation_hardening.py')
          hardening_text = hardening_path.read_text(encoding='utf-8')
          hardening_text = replace_exact(
              hardening_text,
              '    "      ),",\n'
              '    "",\n'
              '    "      await tester.tap(find.text(\'Open editor\'));",\n',
              '    "      ),",\n'
              '    "      );",\n'
              '    "",\n'
              '    "      await tester.tap(find.text(\'Open editor\'));",\n',
              'generated pumpWidget closure',
          )
          hardening_path.write_text(hardening_text, encoding='utf-8')
          compile(hardening_text, str(hardening_path), 'exec')
          print('Both Build 9 patch generators compile after deterministic normalization.')
          PY
          python3 -m py_compile tool/apply_build9_final_workflow_fixes.py
          python3 -m py_compile tool/apply_build9_validation_hardening.py

      - name: Apply final Build 9 corrections
        run: python3 tool/apply_build9_final_workflow_fixes.py

      - name: Apply validation hardening
        run: python3 tool/apply_build9_validation_hardening.py

      - name: Remove now-unused Build 9 theme alias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/core/app_theme.dart')
          text = path.read_text(encoding='utf-8')
          declaration = '    const muted = PremiumGlassPalette.muted;\n'

          count = text.count(declaration)
          if count != 1:
              raise SystemExit(
                  f'{path}: expected exactly one muted declaration after Build 9 theme patch, found {count}'
              )

          updated = text.replace(declaration, '', 1)
          remaining = re.findall(r'\bmuted\b', updated)
          if remaining:
              raise SystemExit(
                  f'{path}: refusing cleanup because {len(remaining)} muted reference(s) remain'
              )

          required = [
              'color: Color(0xFF4A5568)',
              'color: primary',
              'floatingLabelStyle: const TextStyle(',
          ]
          for fragment in required:
              if fragment not in updated:
                  raise SystemExit(
                      f'{path}: expected Build 9 contrast fragment missing: {fragment!r}'
                  )

          path.write_text(updated, encoding='utf-8')
          print('Verified Build 9 contrast styles and removed the now-unused muted alias.')
          PY

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart
        run: dart format lib/commercial/screens/document_editor_dialog.dart lib/screens/pos_screen.dart lib/commercial/screens/commercial_suite_screen.dart lib/commercial/services/commercial_service.dart lib/core/app_theme.dart test/build9_workflow_regression_test.dart

      - name: Check generated diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test Build 9 workflow regression
        run: flutter test test/build9_workflow_regression_test.dart --reporter expanded

      - name: Test full suite
        run: flutter test --reporter expanded

      - name: Commit validated Build 9 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tool/apply_build9_final_workflow_fixes.py
          git rm -f tool/apply_build9_validation_hardening.py
          git rm -f .github/workflows/apply-build9-final-workflow-fixes.yml
          git add -A
          git commit -m "Fix commercial workflows and release Build 9"
          git push origin HEAD:main
