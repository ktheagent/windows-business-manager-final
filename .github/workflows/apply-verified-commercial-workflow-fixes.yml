name: Apply verified commercial workflow fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool/apply_verified_commercial_workflow_fixes.py'
      - '.github/workflows/apply-verified-commercial-workflow-fixes.yml'

permissions:
  contents: write
  actions: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Correct current source marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_verified_commercial_workflow_fixes.py')
          text = path.read_text(encoding='utf-8')
          old = 'class _PurchasesPanelState'
          new = 'class _PurchasingPanelState'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply verified workflow fixes
        run: python3 tool/apply_verified_commercial_workflow_fixes.py

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart
        run: dart format lib/commercial/screens/commercial_suite_screen.dart

      - name: Analyze with visible diagnostics
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Analyzer failed; publishing diagnostic annotations."
            grep -E '(^|[[:space:]])error([[:space:]]| • |-)' analyze.log | head -40 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Flutter Analyze::$line"
            done
          fi
          exit "$status"

      - name: Test
        run: flutter test --reporter expanded

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tool/apply_verified_commercial_workflow_fixes.py
          git rm -f .github/workflows/apply-verified-commercial-workflow-fixes.yml
          git add -A
          git commit -m "Fix verified commercial workflow defaults and stock counting"
          git push origin HEAD:main
