name: Apply Build 9 commercial UX fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-build9-commercial-ux.yml'
      - 'tool/apply_build9_commercial_ux.py'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Apply targeted corrections
        run: python3 tool/apply_build9_commercial_ux.py

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format source
        run: dart format .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

      - name: Commit Build 9 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-build9-commercial-ux.yml
          git rm -f tool/apply_build9_commercial_ux.py
          git add -A
          git commit -m "Fix commercial document entry, visibility and cash shift flow"
          git push origin HEAD:main

      - name: Start Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-build.yml --ref main
