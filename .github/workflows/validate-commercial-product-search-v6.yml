name: Validate commercial product search v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-commercial-product-search-v6.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply commercial product search patch
        run: python .github/scripts/patch_commercial_search.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Use system SQLite for CI validation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          cat >> pubspec.yaml <<'EOF'

          hooks:
            user_defines:
              sqlite3:
                source: system
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed source
        run: dart format lib/commercial/screens/document_editor_dialog.dart

      - name: Analyze changed source
        run: flutter analyze --no-fatal-infos lib/commercial/screens/document_editor_dialog.dart

      - name: Run commercial-related tests
        shell: bash
        run: |
          set -e
          mapfile -t files < <(find test -type f | grep -E 'commercial|document|invoice|quotation' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            flutter test "${files[@]}"
          else
            echo "No specifically named commercial tests found; analyzer passed."
          fi

      - name: Restore CI-only dependency configuration
        shell: bash
        run: |
          git checkout -- pubspec.yaml pubspec.lock 2>/dev/null || git checkout -- pubspec.yaml

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/commercial/screens/document_editor_dialog.dart
          git commit -m "Add product name search to commercial documents"
          git push

# rerun with idempotent helper and system SQLite validation
