name: Apply reporting management upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-reporting-management-upgrade.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Reports panel
        run: |
          python .github/scripts/patch_reporting_upgrade.py
          grep -q "Staff performance" lib/commercial/screens/commercial_suite_screen.dart
          grep -q "DropdownButtonFormField<int>" lib/commercial/screens/commercial_suite_screen.dart

      - name: Patch report permissions
        run: |
          python .github/scripts/patch_report_permissions.py
          grep -q "profit-sensitive reports" lib/commercial/services/advanced_report_service.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Use system SQLite for CI validation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          cat >> pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              sqlite3:
                source: system
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format lib/commercial/screens/commercial_suite_screen.dart
          dart format lib/commercial/services/advanced_report_service.dart

      - name: Analyze changed Dart files
        run: |
          flutter analyze --no-fatal-infos             lib/commercial/screens/commercial_suite_screen.dart             lib/commercial/services/advanced_report_service.dart

      - name: Run reporting and commercial tests
        shell: bash
        run: |
          set -e
          mapfile -t files < <(find test -type f | grep -E 'report|commercial|document|invoice|quotation' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            flutter test "${files[@]}"
          else
            echo "No specifically named reporting/commercial tests found; analyzer passed."
          fi

      - name: Restore CI-only dependency configuration
        shell: bash
        run: |
          git checkout -- pubspec.yaml pubspec.lock 2>/dev/null || git checkout -- pubspec.yaml

      - name: Confirm intended source changes
        shell: bash
        run: |
          grep -q "Staff performance" lib/commercial/screens/commercial_suite_screen.dart
          grep -q "reportsExport" lib/commercial/screens/commercial_suite_screen.dart
          grep -q "profit-sensitive reports" lib/commercial/services/advanced_report_service.dart
          git diff --check

      - name: Commit validated reporting upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/commercial/screens/commercial_suite_screen.dart             lib/commercial/services/advanced_report_service.dart
          git commit -m "Improve branch and staff performance reporting"
          git push

# rerun after repaired reporting helper
